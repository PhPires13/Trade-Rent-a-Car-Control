{# Selo da recomendação de venda; o title explica o nível em linguagem simples. #}
{% if f.nivel == "vender" %}<span class="whitespace-nowrap rounded bg-red-100 px-2 py-0.5 font-semibold text-red-700" title="3 ou mais sinais de alerta: hora de vender, antes da manutenção pesada.">🔴 Vender</span>
{% elif f.nivel == "preparar" %}<span class="whitespace-nowrap rounded bg-orange-100 px-2 py-0.5 font-semibold text-orange-700" title="2 sinais de alerta (ou o carro já devolveu ~75% do que custou): comece a procurar comprador.">🟠 Preparar venda</span>
{% elif f.nivel == "observar" %}<span class="whitespace-nowrap rounded bg-yellow-100 px-2 py-0.5 text-yellow-800" title="1 sinal de alerta: continue alugando, mas acompanhe de perto.">🟡 Observar</span>
{% else %}<span class="whitespace-nowrap rounded bg-green-100 px-2 py-0.5 text-green-700" title="Nenhum sinal de alerta: continue alugando.">🟢 Manter</span>{% endif %}
