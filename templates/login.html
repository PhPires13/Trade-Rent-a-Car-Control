{% extends "base.html" %}

{% block titulo %}Entrar — Trade Rent a Car{% endblock %}

{% block conteudo %}
<div class="mx-auto mt-16 max-w-sm">
  <div class="overflow-hidden rounded-lg shadow-lg">
    <div class="bg-marca-amarelo px-6 py-5 text-center">
      <span class="text-3xl font-black tracking-tight text-marca-preto">TRADE<span class="align-middle">→</span></span>
      <div class="bg-marca-amarelo text-sm italic text-marca-preto">Rent a Car</div>
    </div>
    <div class="bg-marca-preto px-6 py-6">
      {% if form.errors %}
        <p class="mb-4 rounded bg-red-900/40 px-3 py-2 text-sm text-red-200">Usuário ou senha inválidos.</p>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <label class="mb-1 block text-sm text-gray-300" for="id_username">Usuário</label>
        <input id="id_username" name="username" type="text" autofocus required
               class="mb-4 w-full rounded border border-gray-600 bg-gray-800 px-3 py-2 text-white focus:border-marca-amarelo focus:outline-none">
        <label class="mb-1 block text-sm text-gray-300" for="id_password">Senha</label>
        <input id="id_password" name="password" type="password" required
               class="mb-6 w-full rounded border border-gray-600 bg-gray-800 px-3 py-2 text-white focus:border-marca-amarelo focus:outline-none">
        <button type="submit"
                class="w-full rounded bg-marca-amarelo px-4 py-2 font-bold text-marca-preto hover:brightness-95">
          Entrar
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
