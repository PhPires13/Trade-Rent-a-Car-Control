{# "Marcar paga" pergunta quem pagou antes de gravar — uso: include com multa, volta e grande #}
<div x-data="{ aberto: false }" class="{% if grande %}w-full{% endif %}">
  <button type="button" @click="aberto = !aberto" :aria-expanded="aberto"
          class="whitespace-nowrap rounded border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 {% if grande %}w-full px-4 py-3 text-base font-semibold{% else %}px-2 py-1{% endif %}">Marcar paga</button>
  <form x-show="aberto" x-cloak method="post" action="{% url 'multas:marcar_paga' multa.pk %}"
        class="mt-2 rounded border border-gray-200 bg-gray-50 p-3 text-left text-sm">
    {% csrf_token %}<input type="hidden" name="volta" value="{{ volta }}">
    <p class="mb-2 font-medium">Quem pagou a multa de {{ multa.valor|brl }}?</p>
    <div class="flex gap-2">
      <button name="pago_por" value="Empresa" class="flex-1 rounded bg-marca-preto px-3 py-2.5 font-semibold text-white">Empresa</button>
      <button name="pago_por" value="Cliente" class="flex-1 rounded bg-marca-preto px-3 py-2.5 font-semibold text-white">Cliente</button>
    </div>
  </form>
</div>
