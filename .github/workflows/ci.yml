name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Formatação (ruff format)
        run: uv run ruff format --check .
      - name: Testes (pytest)
        run: uv run pytest
